    - num: "4"
      value: "Completed <strong>Projects</strong>"

### Services [ services ]
services:
  title: "전문 분야"
  subtitle: "핵심 <b>역량</b>"
  bg_title: "Services"

  items:
    - title: "데이터 기반 분석 및 설계"
      subtitle: "Data Analysis & Strategy"
      text: "어떤 프로젝트든 핵심을 꿰뚫는 분석력을 바탕으로 접근합니다. 수집된 데이터를 논리적으로 분석하여 인물의 니즈를 파악하고, 이에 맞춘 최적화된 기획과 전략을 설계합니다."
      button_label: "See Pricing"
      button_link: "#pricing-section"

    - title: "조사 분석 및 문서화"
      subtitle: "Research & Reporting"
      text: "필요한 정보를 직접 연구하고 조사하여 논리적인 결과물로 완성합니다. 전문적인 내용도 타겟 독자에 맞춰 명확하게 전달하여, '분석과 설계' 과목에서 최우수 성적을 기록했습니다."
      button_label: "See Pricing"
      button_link: "#pricing-section"

    - title: "논리적 커뮤니케이션과 팀워크"
      subtitle: "Teamwork & Communication"
      text: "목표 달성 과정에서 발생하는 이견을 감정적으로 접근하지 않습니다. 다양한 방법론을 시뮬레이션하고 가장 효율적인 방식을 객관적으로 비교하여, 팀원 모두가 납득할 수 있는 논리적인 합의를 이끌어냅니다."
      button_label: "See Pricing"
      button_link: "#pricing-section"

    - title: "Google Ads"
      subtitle: "Advertising"
      text: "Advertising services include: Google search result pages, gmails, YouTube and other websites participated in Google Ads program."
      button_label: "See Pricing"
      button_link: "#pricing-section"

    - title: "Sound Track"
      subtitle: "Music Writing"
      text: "Music copying, writing, creating, transcription and composition services."
      button_label: "See Pricing"
      button_link: "#pricing-section"

