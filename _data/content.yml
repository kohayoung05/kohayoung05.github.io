        text: "복잡한 IT 기술을 독자가 이해하기 쉬운 직관적인 언어로 재가공하는 문서화 역량"
        value: "90"

  column2:
    items:
      - label: "AI & Vibe Coding"
        text: "생성형 AI와 프롬프트 엔지니어링을 활용하여 아이디어를 빠르게 결과물과 코드로 구현하는 역량"
        value: "90"

      - label: "Python & IT Infra"
        text: "Python 기반 데이터 처리 및 클라우드(AWS/Linux) 환경에 대한 실무적 이해도"
        value: "75"

  column3:
    items:
      - label: "Logical Problem Solving"
        text: "시뮬레이션 기법을 활용하여 객관적인 대안을 탐색하고 팀 프로젝트 효율성 극대화"
        value: "80"

      - label: "Git & GitHub"
        text: "버전 관리 시스템을 활용한 산출물 관리 및 유관 부서(개발/기획)와의 원활한 협업"
        value: "75"

### Resume [ resume ]
resume:
  title: "Resume"
  subtitle: "my <b>Story</b>"
  bg_title: "History"

  education:
    title: "Education"
    items:

      - name: "고등학교 재학 및검정고시"
        subname: "합격"
        subname: "이산고등학교"
        period: "2021 - 2023(중퇴)"
        text: "솔리언 또래상담 학교 대표로서 상담사로서의 자질을 깊이 있게 길렀습니다. 학생들을 직접 인솔하고 주도적으로 상담 활동을 이끌며 리더십을 발휘했습니다."
      - name: "한국폴리텍대학 서울강서캠퍼스"

        subname: "사이버보안과 재학"
        period: "2025 - 현재"
        text: "보안 인프라 구축, 취약점 분석 및 시스템 설계를 전공하며 IT 기술의 기초부터 실무 적용까지 학습하고 있습니다."
  
  experience:
    title: "Experience"
    items:
      - name: "T-RAD 프로젝트 PM"
      - subname: "리눅스 이상 행위 탐지 시스템 개발"
        period: "2026"
        text: "프로젝트 매니저로서 팀원들의 의견을 조율하고, 논리적인 시뮬레이션을 통해 최적의 탐지 룰셋을 설계하여 프로젝트를 성공적으로 리드했습니다."

      - name: "ZARA(자라) 물류센터"
      - subname: "의류 분류 및 패키징 (단기)"
        period: "2023 - 2026"
        text: "약 3년간 유동적으로 출근하며 의류 접기, 포장, 재고 정리 및 운반 업무를 수행했습니다. 반복적인 작업 속에서도 꼼꼼함을 잃지 않고 현장 실무의 기초적인 흐름을 익혔습니다."

      - name: "방이옥"
        subname: "홀 서비스 스태프"
        period: "2023"
        text: "1년간 홀 스태프로 근무하며 매장 서비스 및 고객 응대 업무를 수행했습니다. 현장에서 직접 고객과 소통하며 서비스 마인드를 길렀습니다."


