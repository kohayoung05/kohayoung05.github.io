  after_title: "저는 <strong>IT마케터를 희망하고 있습니다.</strong>"
  description: "사이버보안을 전공하며 선제적인 취약점 분석과 강력한 인프라 보안에 집중하고 있습니다. 클라우드 환경의 시스템 구축과 리눅스 서버 내 비정상 행위 탐지 프로젝트를 통해 실무적인 보안 감각을 키워가고 있습니다."
  button1:
    label: "이력서 보기"
    link: "#이력서 링크 넣기"
  button2:
    label: "포트폴리오 보기"
    link: "#포트폴리오 링크 넣기"
  bg_title: "Cyber Security"
  info:
